name: Build and deploy site

# Manual only, by design -- no push/schedule trigger, same convention as
# JoinSheets.github.io's own deploy workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.148.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the theme submodule)
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: |
          set -euo pipefail
          rm -rf public
          hugo --minify

      - name: .nojekyll
        run: touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
